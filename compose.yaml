# AI 서버만. DB 는 백엔드 리포(dajaba) 의 compose 가 띄운다 — 그 네트워크에 붙는다.
#   1) dajaba 에서: docker compose up db
#   2) 여기서:      docker compose up --build
# 백엔드 .env 의 AI_BASE_URL=http://ai:8000 이 이 서비스를 가리킨다.
services:
  ai:
    build:
      context: .
      args:
        SERVER_VERSION: ${SERVER_VERSION:-dev}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_ai@db:5432/aml
    ports:
      - "8000:8000"
    networks:
      - dajaba_default

networks:
  dajaba_default:
    external: true
